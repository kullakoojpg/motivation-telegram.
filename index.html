.hero-content p{font-size:13px;color:#c0c0be}.btn{border-radius:15px;background:var(--accent);color:#15180b;padding:15px 18px;font-weight:750;min-height:50px}.btn.full{width:100%}.btn.dark{background:#29292d;color:var(--white)}.btn.line{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn.small{min-height:40px;padding:10px 13px;font-size:13px}.card{background:var(--card);border:1px solid var(--border);padding:20px;border-radius:23px;margin-bottom:14px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:17px;text-align:left;color:var(--white);min-height:115px}.mini .icon{color:var(--accent);font-size:23px;display:block;margin-bottom:11px}.mini strong{font-size:15px;display:block}.mini small{display:block;margin-top:3px}.lineitem{border-top:1px solid var(--border);padding:14px 0}.progress{height:5px;background:#333337;border-radius:8px;margin:15px 0}.progress span{height:100%;display:block;background:var(--accent);border-radius:8px}.big{font-size:38px;font-weight:750;letter-spacing:-1.6px}.chip{font-size:11px;color:var(--accent);background:#d6ff6210;padding:7px 10px;border-radius:20px}nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#111114f5;border-top:1px solid var(--border);padding:10px 16px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.navinner{max-width:440px;margin:auto;display:flex}nav button{flex:1;background:none;color:var(--muted);font-size:11px;padding:4px}nav button span{display:block;font-size:23px;line-height:1.25;margin-bottom:4px}nav button.active{color:var(--accent)}dialog{background:var(--bg);color:var(--white);border:1px solid #343438;border-radius:26px;max-width:440px;width:calc(100% - 24px);padding:24px;max-height:88dvh;overflow-y:auto}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}.close{background:#29292d;border-radius:50%;width:34px;height:34px;color:var(--white);font-size:22px}.field{display:block;margin:13px 0}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input{width:100%;min-width:0;background:#202024;border:1px solid #39393e;color:var(--white);padding:13px;border-radius:12px;font-size:16px}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}label.upload{display:inline-block}.empty{border:1px dashed #49494a;border-radius:20px;padding:28px 20px;text-align:center;color:var(--muted);margin:14px 0}.album{display:grid;grid-template-columns:1fr 1fr;gap:10px}.album img{width:100%;height:210px;object-fit:cover;border-radius:16px}.album small{display:block;margin:5px 0}.tiny{color:var(--muted);font-size:11px;line-height:1.5;margin:18px 0}.exercise-title{font-size:29px;line-height:1.14;letter-spacing:-1px;margin:20px 0 12px}.check{display:flex;align-items:center;gap:10px;padding:10px 0}.check input{width:21px;min-height:21px;accent-color:var(--accent)}.steps{display:flex;gap:5px;margin:18px 0}.steps i{height:4px;flex:1;background:#333;border-radius:5px}.steps i.done{background:var(--accent)}#toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:92%;width:max-content;background:var(--accent);color:#171a0c;padding:13px 18px;border-radius:14px;z-index:50;font-size:13px}.mealname{font-size:14px}.mealremove{background:none;color:var(--muted);font-size:22px}.recipe{padding:14px;background:#242428;border-radius:15px;margin:10px 0}.welcome{position:fixed;inset:0;background:#090909;z-index:30;display:flex;justify-content:center;align-items:center}.welcome-inner{width:100%;max-width:480px;height:100%;position:relative;overflow:hidden}.welcome img{width:100%;height:100%;object-fit:cover;position:absolute}.welcome .welcome-copy{position:absolute;bottom:7%;left:28px;right:28px}.welcome h1{font-size:45px;font-weight:900;letter-spacing:-2px}.welcome .logo{position:absolute;top:30px;left:28px;z-index:2}.kpi{text-align:center;padding:10px 0}.kpi strong{display:block;font-size:28px}.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}@media(min-width:700px){.shell{margin-top:24px}body{background:radial-gradient(ellipse at 50% 0,#242522,#0c0c0e 60%)}nav{left:50%;transform:translateX(-50%);max-width:480px;border-radius:24px 24px 0 0}.welcome-inner{max-height:880px;border-radius:28px}}

</script></head><body><div class="shell"><header><div class="logo">мотивация<span class="dot">.</span></div><button class="round" onclick="settings()" aria-label="Настройки">⚙</button></header><main id="main"></main><p class="tiny">Личный прототип · данные только в этом браузере.<br>Пока без Telegram и облака.</p></div><nav><div class="navinner" id="nav"></div></nav><dialog id="dialog"></dialog><div id="toast" role="status"></div><script>
'use strict';
const $=id=>document.getElementById(id),KEY='motivation.simple.v2';
const date=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fresh=()=>({version:2,cover:null,photos:[],days:{},targets:{kcal:2200,p:165},intro:true});let state=fresh(),tab='home',index=0,restEnd=0;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===2&&s.days&&s.targets&&Array.isArray(s.photos))state=s}catch(e){}
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function day(){const key=date();if(!state.days[key])state.days[key]={food:[],weight:null,workout:null};return state.days[key]}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    syncStateToServer();
    return true;
  }catch(e){
    toast('Память заполнена или недоступна. Сохрани резервную копию в настройках.');
    return false;
  }
}

const API_URL='https://motivation-api.kullakoo-jpg.workers.dev';

async function syncStateToServer(){
  const tg=window.Telegram?.WebApp;

  if(!tg?.initData) return;

  try{
    await fetch(API_URL+'/profile',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'X-Telegram-Init-Data':tg.initData
      },
      body:JSON.stringify({
        profile_json:state
      })
    });
  }catch(e){
    console.warn('Не удалось синхронизировать данные с сервером',e);
  }
}

async function loadStateFromServer(){
  const tg=window.Telegram?.WebApp;

  if(!tg?.initData) return;

  try{
    const response=await fetch(API_URL+'/me',{
      headers:{
        'X-Telegram-Init-Data':tg.initData
      }
    });

    const result=await response.json();

    if(
      result.ok &&
      result.profile?.profile_json
    ){
      const serverState=JSON.parse(result.profile.profile_json);

      if(serverState && typeof serverState==='object'){
        state={
          ...state,
          ...serverState
        };

        localStorage.setItem(KEY,JSON.stringify(state));
        draw();
      }
    }
  }catch(e){
    console.warn('Не удалось загрузить данные с сервера',e);
  }
}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3800)}
const plans=[[['Жим ногами','8–12','Опускай плавно. Не отрывай таз от спинки.'],['Жим в тренажёре для груди','8–12','Держи лопатки устойчиво. Двигайся без боли.'],['Тяга верхнего блока','10–15','Тяни к груди, не за голову. Без рывков.'],['Сгибание ног','10–15','Возвращай вес медленно.'],['Гантели в стороны','10–15','Без раскачивания. Не поднимай плечи.'],['Разгибание рук на блоке','10–15','Не двигай локтями.'],['Скручивания на блоке','10–15','Делай плавно, не тяни руками.']],[['Ягодичный мост в тренажёре','8–12','Не прогибай поясницу.'],['Наклонный жим гантелей','8–12','Небольшой наклон. Комфортная амплитуда.'],['Горизонтальная тяга','10–15','Не раскачивай корпус.'],['Жим ногами','10–15','Контролируй опускание.'],['Гантели в стороны','10–15','Лёгкий вес, без рывков.'],['Сгибание рук с гантелями','10–15','Локти устойчивы.'],['Подъёмы коленей в упоре','8–15','Без махов. Пропусти при дискомфорте.']],[['Жим ногами','8–12','Не отрывай таз от спинки.'],['Жим в тренажёре для груди','8–12','Контролируй вес на всём движении.'],['Тяга верхнего блока','10–15','Плавно возвращай рукоять.'],['Сгибание ног','10–15','Комфортная амплитуда.'],['Горизонтальная тяга','10–15','Без рывков.'],['Сгибание рук на блоке','10–15','Не раскачивайся.'],['Скручивания на блоке','10–15','Не тяни руками.']]];
function completed(){return Object.values(state.days).filter(d=>d.workout?.done).length}
function workout(){if(!day().workout)day().workout={plan:completed()%3,sets:{},done:false};return day().workout}
function totals(){return day().food.reduce((s,f)=>({kcal:s.kcal+f.kcal,p:s.p+f.p}),{kcal:0,p:0})}
function move(t){tab=t;draw();window.scrollTo(0,0)}
function draw(){const nav=[['home','⌂','Сегодня'],['food','◷','Еда'],['me','◉','Мой путь']];$('nav').innerHTML=nav.map(([k,i,t])=>`<button class="${tab===k?'active':''}" onclick="move('${k}')"><span aria-hidden="true">${i}</span>${t}</button>`).join('');$('main').innerHTML=({home:home,food:food,me:me}[tab])()}
function hero(){return `<section class="hero">${state.cover?`<img src="${safe(state.cover)}" alt="Твоё фото-мотивация">`:''}<div class="shade"></div><span class="hero-top">ТВОЙ ТЕМП. ТВОЙ ПУТЬ.</span><div class="hero-content"><div class="eyebrow">Начни с одного шага</div><h2>Не идеально.<br>Зато для себя.</h2><label class="upload btn small dark">${state.cover?'Сменить фото':'＋ Фото-мотивация'}<input type="file" accept="image/jpeg,image/png,image/webp" onchange="photo(this,'cover')"></label></div></section>`}
function home(){const t=totals(),done=day().workout?.done;return `<div class="eyebrow">${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'})}</div><h1>Сегодня — для тебя.</h1>${hero()}<section class="card"><div class="row between"><h2>${done?'Тренировка записана':'Твоя тренировка'}</h2><span class="chip">Всё тело</span></div><p class="muted">${done?'Готово на сегодня. Дай себе восстановиться.':'Одно упражнение за раз. Мы покажем, что делать.'}</p><button class="btn full ${done?'dark':''}" onclick="startWorkout()">${done?'Посмотреть тренировку':'Начать тренировку →'}</button><small style="display:block;margin-top:10px">3 раза в неделю · между занятиями — день отдыха</small></section><div class="grid"><button class="mini" onclick="move('food')"><span class="icon">＋</span><strong>Записать еду</strong><small>${t.kcal?Math.round(t.kcal)+' из '+state.targets.kcal+' ккал':'Без записей на сегодня'}</small></button><button class="mini" onclick="move('me')"><span class="icon">↗</span><strong>Мой прогресс</strong><small>Фото, вес и тренировки</small></button></div>`}
function open(content){$('dialog').innerHTML=content;$('dialog').showModal()}
function sheetHeader(title){return `<div class="sheet-top"><h2 style="margin:0">${title}</h2><button class="close" onclick="$('dialog').close()" aria-label="Закрыть">×</button></div>`}
function startWorkout(){if(day().workout?.done){index=0;exercise();return}open(`${sheetHeader('Без спешки')}<p>Первые 4 недели — возвращаем привычку, а не старые рекорды.</p><div class="lineitem">Разомнись и сделай лёгкие подводящие подходы.</div><div class="lineitem">Выбирай вес, с которым осталось бы ещё примерно 3 повтора.</div><div class="lineitem">Боль — повод остановить упражнение, а не терпеть.</div><p class="tiny">План — черновик по твоей стратегии. При травмах или ограничениях его нужно адаптировать со специалистом. Рабочие веса не назначены.</p><button class="btn full" onclick="begin()">Понятно, начнём →</button>`)}
function begin(){workout();save();index=0;exercise()}
function exercise(){const w=workout(),list=plans[w.plan],e=list[index],sets=w.sets[index]||[{},{}];if(!$('dialog').open)$('dialog').showModal();$('dialog').innerHTML=`${sheetHeader('Тренировка')}<div class="eyebrow">Упражнение ${index+1} из ${list.length}</div><div class="steps">${list.map((_,i)=>`<i class="${i<=index?'done':''}"></i>`).join('')}</div><h3 class="exercise-title">${e[0]}</h3><span class="chip">2 подхода · ${e[1]} повторений</span><p class="muted" style="margin-top:15px">${e[2]}</p>${sets.map((s,j)=>`<div class="lineitem"><label class="check"><input type="checkbox" ${s.ok?'checked':''} onchange="setval(${j},'ok',this)"><strong>Подход ${j+1} сделан</strong></label><div class="grid"><label class="field"><span>Вес, кг</span><input aria-label="Вес подхода ${j+1}" type="number" min="0" max="1000" step="0.5" value="${safe(s.kg)}" placeholder="Не указан" onchange="setval(${j},'kg',this)"></label><label class="field"><span>Повторы</span><input aria-label="Повторы подхода ${j+1}" type="number" min="1" max="100" step="1" value="${safe(s.reps)}" placeholder="Сколько сделал" onchange="setval(${j},'reps',this)"></label></div></div>`).join('')}<button class="btn dark full" onclick="restEnd=Date.now()+90000;tick()" id="rest">${restEnd>Date.now()?restText():'Отдохнуть 90 секунд'}</button><div class="row" style="margin-top:12px">${index?'<button class="btn line" onclick="index--;exercise()" aria-label="Предыдущее упражнение">←</button>':''}<button class="btn full" onclick="next()">${index===list.length-1?'Завершить':'Следующее упражнение →'}</button></div><small style="display:block;margin-top:12px">Можно пропустить упражнение. Не нужно выполнять через боль.</small>`}
function setval(j,key,el){if(key!=='ok'&&!el.checkValidity()){el.reportValidity();return}const w=workout();if(!w.sets[index])w.sets[index]=[{},{}];w.sets[index][j][key]=key==='ok'?el.checked:(el.value===''?null:Number(el.value));save()}
function next(){if(index<plans[workout().plan].length-1){index++;exercise()}else finish()}
function finish(){openSummary()}
function openSummary(){const w=workout(),n=Object.values(w.sets).flat().filter(x=>x.ok).length;$('dialog').innerHTML=`${sheetHeader('На сегодня всё')}<div class="big">${n} <small>подходов отмечено</small></div><p class="muted">Только фактические записи. Пропущенные подходы не считаются выполненными.</p><label class="field"><span>Как самочувствие? Была ли боль?</span><input id="feeling" maxlength="500" value="${safe(w.feeling||'')}" placeholder="Можно коротко"></label><button class="btn full" onclick="saveWorkout()">Сохранить тренировку</button>`}
function saveWorkout(){const w=workout();if(!Object.values(w.sets).flat().some(x=>x.ok&&x.reps>0)){toast('Укажи повторы хотя бы одного выполненного подхода.');index=0;exercise();return}w.feeling=$('feeling').value;w.done=true;if(save()){$('dialog').close();draw();toast('Тренировка сохранена. Теперь восстановление.')}}
function restText(){const s=Math.max(0,Math.ceil((restEnd-Date.now())/1000));return `Отдых · ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function tick(){if($('rest'))$('rest').textContent=restEnd>Date.now()?restText():'Отдохнуть 90 секунд';if(restEnd&&restEnd<=Date.now()){restEnd=0;toast('Пауза закончилась. Продолжай, если восстановился.')}}setInterval(tick,500);
function food(){const t=totals();return `<div class="eyebrow">Просто и без крайностей</div><h1>Что сегодня ел?</h1><section class="card"><div class="row between"><div><div class="big">${Math.round(t.kcal)}</div><small>из ${state.targets.kcal} ккал</small></div><span class="chip">Белок ${Math.round(t.p)} / ${state.targets.p} г</span></div><div class="progress"><span style="width:${Math.min(100,t.kcal/state.targets.kcal*100)}%"></span></div><button class="btn full" onclick="addFood()">＋ Добавить еду</button></section>${day().food.length?day().food.map((f,i)=>`<div class="row between lineitem"><div><strong class="mealname">${safe(f.name)}</strong><br><small>${f.kcal} ккал · белок ${f.p} г</small></div><button class="mealremove" aria-label="Удалить ${safe(f.name)}" onclick="day().food.splice(${i},1);save();draw()">×</button></div>`).join(''):'<p class="muted" style="text-align:center;margin:24px 0">Добавь первую запись. Без оценок и чувства вины.</p>'}<button class="btn line full" style="margin-top:16px" onclick="recipes()">Что приготовить? →</button><p class="tiny">2200 ккал и 165 г белка — твои стартовые ориентиры, не жёсткий лимит. Калории не меняются автоматически.</p>`}
function addFood(){open(`${sheetHeader('Добавить еду')}<form id="meal"><label class="field"><span>Что ел?</span><input id="mealname" required maxlength="120" placeholder="Например, курица с рисом"></label><div class="grid"><label class="field"><span>Калории порции</span><input id="kc" required type="number" min="0" max="20000" step="1" placeholder="ккал"></label><label class="field"><span>Белок порции</span><input id="protein" required type="number" min="0" max="1000" step="0.1" placeholder="г"></label></div><p class="tiny">Укажи значения всей порции с упаковки или из своего расчёта. Здесь нет распознавания еды и базы продуктов.</p><button class="btn full" type="submit">Сохранить</button></form>`);$('meal').onsubmit=e=>{e.preventDefault();day().food.push({name:$('mealname').value.trim()||'Порция',kcal:Number($('kc').value),p:Number($('protein').value)});if(save()){$('dialog').close();draw()}}}
function recipes(){open(`${sheetHeader('Без сложных рецептов')}<div class="recipe"><h3>Курица + рис + овощи</h3><p>Куриное филе 150 г, рис 60 г в сухом виде, овощи 200 г, масло 10 г.</p><small>Рис отвари. Курицу приготовь до полной готовности, овощи потуши. Масло учитывай отдельно.</small></div><div class="recipe"><h3>Творог + ягоды</h3><p>Творог 180 г, ягоды 100 г, овсяные хлопья 25 г.</p><small>Хлопья приготовь по инструкции, добавь творог и ягоды.</small></div><p class="tiny">Это идеи, не рассчитанное меню. Калории и белок зависят от конкретных продуктов и порции. Учитывай аллергии и ограничения питания.</p>`)}

function coachDialog(){open(`${sheetHeader('Мой план')}<span class="chip">${planName()}</span><p style="margin-top:18px">3 силовые в неделю, 2 подхода. Между занятиями — отдых. Акцент на технике, а не рекордах.</p><form id="coachform"><label class="field"><span>Дата начала</span><input id="planstart" type="date" required value="${safe(state.coach.start)}"></label><label class="field"><span>Травмы, ограничения, рекомендации специалиста</span><input id="healthlimits" maxlength="800" value="${safe(state.coach.limits)}" placeholder="Например: нет известных / есть ограничения"></label><label class="check"><input id="planaccept" type="checkbox" ${state.coach.accepted?'checked':''}><small>Я выбрал этот черновой план. При ограничениях согласую адаптацию со специалистом.</small></label><button class="btn full">Иду по этому плану</button></form><p class="tiny">Это выбор плана, не медицинский допуск. После 4 недель план не усложняется автоматически. Питание рассчитывается от твоих 2200 ккал — энергозатраты пока не оцениваются.</p>`);$('coachform').onsubmit=e=>{e.preventDefault();if(!$('planaccept').checked){toast('Подтверди выбор плана.');return}state.coach.start=$('planstart').value;state.coach.limits=$('healthlimits').value;state.coach.accepted=true;if(save()){$('dialog').close();draw()}}}
home=function(){const n=planDay(),p=plannedWorkout(),done=day().workout?.done,selected=state.coach.accepted,started=state.coach.start<=date(),t=totals();const status=!selected?'Выбери свой план':!started?'План начнётся '+state.coach.start:n>=28?'Стартовый блок завершён':done?'Тренировка записана':p===null?'Сегодня восстановление':'Сегодня — тренировка '+['A','B','C'][p];return `<div class="eyebrow">${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div><h1>План готов.<br>Просто начни.</h1>${hero()}<section class="card"><div class="row between"><h2>${status}</h2><span class="chip">${selected&&started&&n<28?'День '+(n+1):'4 недели'}</span></div><p class="muted">${!selected?'Выбираешь один раз. Дальше приложение ведёт по шагам.':done?'Фактические подходы сохранены. Теперь отдых.':p===null?'Без силовой сегодня. Лёгкая активность по самочувствию.':'2 подхода · 7 упражнений · с подсказками движения'}</p><button class="btn full" onclick="${!selected?'coachDialog()':(!started||n>=28)?'coachDialog()':(done?'startWorkout()':p===null?'recovery()':'startWorkout()')}">${!selected?'Выбрать план →':!started?'Посмотреть план':n>=28?'Пересмотреть план':done?'Посмотреть результат':p===null?'Отметить восстановление':'Начать тренировку →'}</button><button class="btn line full small" style="margin-top:8px" onclick="coachDialog()">${planName()} · изменить</button></section><div class="grid"><button class="mini" onclick="move('food')"><span class="icon">◷</span><strong>Меню уже рассчитано</strong><small>${t.kcal?Math.round(t.kcal)+' ккал записано':'Подтверди съеденные порции'}</small></button><button class="mini" onclick="move('me')"><span class="icon">↗</span><strong>Мой путь</strong><small>Вес, фото и план</small></button></div>`}

// Nutrient values are transparent illustrative defaults, not a branded-food database.
function macroItems(items){return items.reduce((a,x)=>{const f=foods[x.id];a.p+=f[1]*x.g/100;a.f+=f[2]*x.g/100;a.c+=f[3]*x.g/100;return a},{p:0,f:0,c:0})}
function withKcal(t){return {...t,kcal:t.p*4+t.f*9+t.c*4}}
function mealStats(m){return withKcal(macroItems(m.items))}
function solve3(a,b){a=a.map((r,i)=>[...r,b[i]]);for(let i=0;i<3;i++){let k=i;for(let j=i+1;j<3;j++)if(Math.abs(a[j][i])>Math.abs(a[k][i]))k=j;[a[k],a[i]]=[a[i],a[k]];const pivot=a[i][i];if(Math.abs(pivot)<1e-8)return null;for(let z=i;z<4;z++)a[i][z]/=pivot;for(let j=0;j<3;j++)if(j!==i){const s=a[j][i];for(let z=i;z<4;z++)a[j][z]-=s*a[i][z]}}return a.map(r=>r[3])}
function makeMenu(variant=0){const m=[{title:'Завтрак',name:'Овсянка с йогуртом и бананом',items:[{id:'oats',g:70},{id:'yogurt',g:200},{id:'banana',g:120}],how:'Приготовь хлопья по инструкции, затем добавь йогурт и банан.'},{title:'Обед',name:variant?'Индейка с гречкой':'Курица с рисом',items:[{id:variant?'turkey':'chicken',g:180},{id:variant?'buckwheat':'rice',g:85},{id:'veg',g:200},{id:'oil',g:12}],how:'Крупу отвесь сухой и отвари. Мясо приготовь до полной готовности. Добавь овощи и отмеренное масло.'},{title:'Перекус',name:'Творог с ягодами и орехами',items:[{id:'curd',g:200},{id:'berries',g:100},{id:'nuts',g:20}],how:'Смешай творог и ягоды, добавь отмеренные орехи.'},{title:'Ужин',name:'Индейка с картофелем',items:[{id:'turkey',g:160},{id:'potato',g:280},{id:'veg',g:200},{id:'oil',g:12}],how:'Мясо приготовь до полной готовности, картофель запеки или отвари. Добавь овощи и масло.'}];const all=m.flatMap(x=>x.items),groups=['p','c','f'].map(g=>macroItems(all.filter(x=>foods[x.id][4]===g))),fix=macroItems(all.filter(x=>foods[x.id][4]==='fixed')),p=state.targets.p,f=state.targets.f||70,c=(state.targets.kcal-p*4-f*9)/4;const sol=solve3(['p','f','c'].map(k=>groups.map(g=>g[k])),[p-fix.p,f-fix.f,c-fix.c]);if(!sol||sol.some(x=>x<.15||x>3))return null;all.forEach(x=>{const g=['p','c','f'].indexOf(foods[x.id][4]);if(g>=0)x.g=Math.round(x.g*sol[g]);});return m}

food=function(){if(!state.coach.foodOK)return `<div class="eyebrow">Не считай всё вручную</div><h1>Меню на день.</h1><div class="card"><h2>Порции — за нас.<br>Выбор — за тобой.</h2><p class="muted">Рассчитаем 4 приёма пищи под твои ${state.targets.kcal} ккал и ${state.targets.p} г белка. Ты отмечаешь съеденное или меняешь граммы.</p><button class="btn full" onclick="mealSetup()">Рассчитать меню →</button><button class="btn line full small" style="margin-top:10px" onclick="addFood()">Записать свою еду</button></div>`;const menu=getMenu(),t=totals();if(!menu)return `<h1>Нужна настройка.</h1><p>Для этих целей базовое меню не даёт разумных порций. Измени ориентиры или запиши свою еду.</p><button class="btn" onclick="settings()">Ориентиры</button><button class="btn dark" onclick="addFood()">Своя еда</button>`;const planned=withKcal(macroItems(menu.flatMap(m=>m.items)));return `<div class="eyebrow">Сначала план. Потом факт.</div><h1>Твоё меню.</h1><div class="card"><div class="row between"><div><div class="big">${Math.round(t.kcal)}</div><small>съедено из ${state.targets.kcal} ккал</small></div><span class="chip">Белок ${Math.round(t.p)} / ${state.targets.p} г</span></div><div class="progress"><span style="width:${Math.min(100,t.kcal/state.targets.kcal*100)}%"></span></div><small>План: ≈ ${Math.round(planned.kcal)} ккал · Б ${Math.round(planned.p)} / Ж ${Math.round(planned.f)} / У ${Math.round(planned.c)} г</small></div>${menu.map((m,i)=>{const n=mealStats(m),logged=day().food.some(x=>x.menuSlot===i);return `<section class="card"><div class="row between"><span class="eyebrow">${m.title}</span><span class="chip">${logged?'✓ Съедено':'В плане'}</span></div><h2 style="margin-top:12px">${m.name}</h2><p class="muted">≈ ${Math.round(n.kcal)} ккал · ${Math.round(n.p)} г белка</p><p>${m.items.map(x=>`${foods[x.id][0]} — <strong>${x.g} г</strong>`).join('<br>')}</p><div class="row"><button class="btn full ${logged?'dark':''}" onclick="confirmMeal(${i})">${logged?'Отменить отметку' if(onStep===4){const c=calcProfile(draft);html=`<h1>Твой первый шаг.</h1><p><strong>${safe(draft.name)}</strong>, начнём с устойчивого ритма.</p><div class="card">${c.manual?`<h2>Сначала уточним ориентиры</h2><p>${c.reason}</p>`:`<div class="big">${c.kcal} <small>ккал в день</small></div><p>Б ${c.p} · Ж ${c.f} · У ≈ ${c.c} г</p><small>Формула Mifflin–St Jeor: базовый обмен ≈ ${c.bmr} ккал; с активностью ≈ ${c.tdee}. Это оценка, не измерение расхода. Проверяем по тенденции за 2–3 недели.</small>`}</div><p>${draft.equipment==='gym'&&!c.manual?draft.days.map(d=>weekdayNames[d]).join(' · ')+' — силовые, между ними отдых.':'Тренировочный план не назначен. Доступны дневник, фото и ручные записи.'}</p><p class="muted">Заготовки на ${draft.prep} дня. Любимые продукты в приоритете, исключённые не попадут в меню.</p><label class="check"><input id="onconsent" type="checkbox"><small>Согласен сохранить анкету и записи в этом браузере. Понимаю, что расчёты приблизительные. Данные можно удалить в настройках.</small></label>`}

if(onStep<4){onStep++;onboard();return}if(!state._confirmingTargets&&!$('onconsent').checked){toast('Нужно согласие на сохранение анкеты.');return}const result=calcProfile(draft),changed=!!state.onboarded;if(onStep===4&&!state._confirmingTargets&&!result.manual){state._pendingTargetResult=result;state._pendingTargetChanged=changed;showTargetConfirm(result);return}state._confirmingTargets=false;state.profile=JSON.parse(JSON.stringify(draft));state.estimate=result;state.onboarded=true;state.coach={...state.coach,start:state.coach.start||date(),accepted:!result.manual&&draft.equipment==='gym',foodOK:!result.manual,limits:draft.limits};state.targets=result.manual?{kcal:null,p:null,f:null}:state.manualTargets||{kcal:result.kcal,p:result.p,f:result.f};state.manualTargets=null;state.currentBatch=null;state.menuRevision=(state.menuRevision||0)+1;state.reminders.zone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';if(save()){$('dialog').close();move('home');toast(changed?'Профиль обновлён. Старые записи сохранены.':'Твой план готов. Начнём спокойно.')}}

plannedWorkout=function(forDate=date()){if(!state.profile||!state.coach.accepted)return null;const n=Math.floor((new Date(forDate+'T12:00:00')-new Date(state.coach.start+'T12:00:00'))/86400000);if(n<0||n>=28)return null;const d=new Date(forDate+'T12:00:00').getDay();if(!state.profile.days.includes(d))return null;let count=0;for(let i=0;i<=n;i++)if(state.profile.days.includes(new Date(dateAdd(state.coach.start,i)+'T12:00:00').getDay()))count++;return (count-1)%3};

function weekPlan(){let chosen=date();function paint(){open(`${sheetHeader('Ближайшие 7 дней')}<p class="muted">Пропущенные занятия не считаются выполненными. Дни можно поменять в анкете.</p><div class="calendar">${Array.from({length:7},(_,i)=>{const d=dateAdd(date(),i);return `<button class="${d===chosen?'selected':''}" data-day="${d}"><small>${weekdayNames[new Date(d+'T12:00:00').getDay()]}</small><strong>${d.slice(8)}</strong><span>${plannedWorkout(d)===null?'○':'●'}</span></button>`}).join('')}</div><h2>${chosen===date()?'Сегодня':chosen===dateAdd(date(),1)?'Завтра':chosen.slice(8)+'.'+chosen.slice(5,7)}</h2><p>${trainingTitle(chosen)}</p>${plannedWorkout(chosen)!==null?`<div class="card">${trainingPlan({plan:plannedWorkout(chosen)}).map(e=>`<p>${e[0]}<br><small>${workSets()} × ${e[1]}</small></p>`).join('')}</div>`:'<div class="card"><p>Сон и восстановление. Лёгкая прогулка по самочувствию.</p></div>'}<p>Питание: ${state.targets.kcal||'ручные ориентиры'} ${state.targets.kcal?'ккал':''}. Заготовки — блоками по ${state.profile.prep} дня.</p><small>Список упражнений меняется по уровню: новичкам 5, возвращающимся и регулярно тренирующимся 7; подходы 2 / 2 / 3. Это базовые шаблоны, не анализ техники.</small>`);$('dialog').querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{chosen=el.dataset.day;paint()})}paint()}
home=function(){if(!state.onboarded)return '<h1>Твой план начинается с тебя.</h1><button class="btn full" onclick="startOnboarding()">Заполнить анкету →</button>';const p=state.profile,done=day().workout?.done,scheduled=plannedWorkout(),title=done?'Тренировка записана':trainingTitle(date());return `<div class="eyebrow">${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div><h1>${safe(p.name)},<br>один шаг сегодня.</h1>${hero()}<section class="card"><div class="row between"><h2>${title}</h2><span class="chip">Твой план</span></div><p class="muted">${!state.coach.accepted?'Профиль требует индивидуальных ориентиров. Пока ведём дневник.':done?'Запись есть. Теперь дай себе восстановиться.':scheduled===null?'Не нужно догонять пропущенное. Сегодня можно восстановиться.':`${trainingPlan({plan:scheduled}).length} упражнений · ${workSets()} подхода · техника по шагам`}</p><button class="btn full" onclick="${!state.coach.accepted?'profileInfo()':done?'openSavedWorkout()':scheduled===null?'recovery()':'startWorkout()'}">${!state.coach.accepted?'Мои ориентиры':done?'Мой результат':scheduled===null?'Отметить самочувствие':'Начать тренировку →'}</button><button class="btn line full small" style="margin-top:8px" onclick="weekPlan()">Завтра: ${trainingTitle(dateAdd(date(),1))} →</button></section><div class="grid"><button class="mini" onclick="move('food')"><span class="icon">◷</span><strong>Еда уже в плане</strong><small>Заготовки на ${p.prep} дня</small></button><button class="mini" onclick="shopping()"><span class="icon">＋</span><strong>Купить продукты</strong><small>Один список на все блюда</small></button></div><div class="encourage">${motivation()}</div><button class="btn line full small" onclick="reminderSettings()">Моя поддержка и напоминания</button>`}
function motivation(){if(day().workout?.done)return 'Ты записал тренировку. Именно такие действия складываются в прогресс.';if(day().food.length)return 'Питание уже в дневнике. Продолжай по плану без требования идеальности.';return ['Не нужно быть идеальным. Достаточно сделать следующий шаг.','Твой темп важнее чужих результатов.','Сегодня можно начать с малого. Регулярность придёт из повторений.'][new Date().getDate()%3]}

function allowed(id){const p=state.profile,m=meta[id];if(!m)return false;if(p.avoids.includes(m[0])||m[1].some(a=>p.allergies.includes(a)))return false;if(p.diet!=='all'&&['poultry','fish'].includes(m[0]))return false;if(p.diet==='vegan'&&['dairy','eggs'].includes(m[0]))return false;return true}

function buildPersonalMenu(){if(!state.targets.kcal)return {error:'Нужны индивидуальные ориентиры питания. Автоподбор отключён для этого профиля.'};const protein=choose(['chicken','turkey','fish','tofu','eggs']),breakfastP=choose(['yogurt','curd','tofu','eggs']),carb=choose(['rice','buckwheat','pasta','potato']),breakfastC=choose(['oats','buckwheat','rice','potato']),fruit=choose(['banana','berries']),veg=choose(['veg']),fat=choose(['oil','nuts']);if(!protein||!breakfastP||!carb||!breakfastC||!fruit||!veg||!fat)return {error:'После исключений не хватает совместимых продуктов для полноценного шаблона. Ничего запрещённого не добавлено. Измени предпочтения или используй ручной дневник.'};const m=[{title:'Завтрак',name:`${foods[breakfastC][0].split(' ·')[0]} + ${foods[breakfastP][0].split(' ·')[0]}`,items:[{id:breakfastC,g:65},{id:breakfastP,g:150},{id:fruit,g:100}]},{title:'Обед',name:protein==='tofu'?'Тофу с гарниром и запечёнными овощами':'Лимонная тарелка с гарниром',items:[{id:protein,g:170},{id:carb,g:carb==='potato'?270:80},{id:veg,g:200},{id:fat,g:12}]},{title:'Перекус',name:`${foods[breakfastP][0].split(' ·')[0]} с ${fruit==='banana'?'бананом':'ягодами'}`,items:[{id:breakfastP,g:150},{id:fruit,g:100}]},{title:'Ужин',name:'Томатное рагу с пряностями',items:[{id:protein,g:160},{id:carb,g:carb==='potato'?250:70},{id:veg,g:200},{id:fat,g:12}]}];const all=m.flatMap(x=>x.items),groups=['p','c','f'].map(g=>macroItems(all.filter(x=>foods[x.id][4]===g))),fix=macroItems(all.filter(x=>foods[x.id][4]==='fixed')),target={p:state.targets.p,f:state.targets.f,c:(state.targets.kcal-state.targets.p*4-state.targets.f*9)/4};let sol=solve3(['p','f','c'].map(k=>groups.map(g=>g[k])),['p','f','c'].map(k=>target[k]-fix[k]));if(!sol||sol.some(x=>!Number.isFinite(x)||x<.1||x>4))return {error:'Для этих продуктов не получились разумные порции под заданные БЖУ. Попробуй другой источник белка, крупы или жиров. Меню не подменено запрещёнными продуктами.'};all.forEach(x=>{const g=['p','c','f'].indexOf(foods[x.id][4]);if(g>=0)x.g=Math.round(x.g*sol[g])});if(all.some(x=>x.g>650))return {error:'Порции получились слишком большими для шаблона. Добавь разнообразие в предпочтения; пока доступен ручной ввод.'};m.forEach(x=>x.how=recipeSteps(x));return {meals:m}}
function getBatch(){if(state.currentBatch&&state.currentBatch.revision===state.menuRevision&&date()>=state.currentBatch.start&&date()<dateAdd(state.currentBatch.start,state.currentBatch.count))return state.currentBatch;const built=buildPersonalMenu();if(built.error)return built;const batch={id:Date.now().toString(),revision:state.menuRevision,start:date(),count:state.profile.prep,meals:built.meals,bought:{},cooked:false};state.currentBatch=batch;save();return batch}

function recipeSteps(m){const ids=m.items.map(x=>x.id),has=id=>ids.includes(id);return [(has('oats')?'Приготовь овсянку на воде по инструкции.':has('rice')||has('buckwheat')||has('pasta')?'Отвесь гарнир сухим; свари по инструкции на упаковке.':has('potato')?'Нарежь картофель дольками, приготовь до мягкости.':''),(has('chicken')||has('turkey')?'Замаринуй птицу с лимоном, чесноком и паприкой; приготовь до 74 °C внутри.':has('fish')?'Приправь рыбу лимоном и укропом, приготовь до 63 °C внутри.':has('tofu')?'Промокни тофу, нарежь, добавь чеснок и паприку, запеки или обжарь на отмеренном масле.':has('eggs')?'Яйца приготовь до схватывания белка и желтка; при хранении следуй срокам для выбранного блюда.':''),(has('veg')?(m.title==='Ужин'?'Часть овощей потуши с томатами из овощной смеси, чесноком и сушёными травами.':'Овощи запеки отдельно с паприкой, лимонным соком и травами.'):'Добавь выбранные фрукты или ягоды. Молочные продукты храни отдельно в холодильнике.'),(has('oil')?'Отмерь масло из порции: часть на приготовление, остаток — при подаче. Дополнительные соусы учитывай отдельно.':has('nuts')?'Отвесь орехи и добавь при подаче.':'')].filter(Boolean)}
food=function(){const b=getBatch(),m=b.error?null:getMenu(),t=totals();return `<div class="eyebrow">Под твои вкусы</div><h1>Готовь реже.<br>Ешь с удовольствием.</h1><div class="card"><div class="row between"><div class="big">${Math.round(t.kcal)} <small>ккал</small></div><span class="chip">${state.targets.kcal||'Ручной режим'} ${state.targets.kcal?'в плане':''}</span></div><small>Белок записан: ${Math.round(t.p)} ${state.targets.p?'из '+state.targets.p:''} г</small></div>${b.error?`<div class="card"><h2>Нужно уточнить меню</h2><p>${safe(b.error)}</p><button class="btn dark full" onclick="startOnboarding()">Мои предпочтения</button></div>`:`<div class="grid" style="margin-bottom:15px"><button class="btn dark" onclick="batchCooking()">Готовлю на ${b.count} дня</button><button class="btn dark" onclick="shopping()">Список покупок</button></div><p class="tiny">Блок ${b.start} — ${dateAdd(b.start,b.count-1)}. Базовые блюда повторяются: при подаче меняй травы и лимон. Граммовки ниже — на один день.</p>${m.map((x,i)=>{const n=mealStats(x),logged=day().food.some(f=>f.menuSlot===i);return `<div class="card"><div class="row between"><span class="eyebrow">${x.title}</span><small>≈ ${Math.round(n.kcal)} ккал</small></div><h2 style="margin-top:12px">${x.name}</h2><details><summary class="muted">Продукты и порция</summary><p>${x.items.map(v=>`${foods[v.id][0]} — ${v.g} г`).join('<br>')}</p></details><div class="row"><button class="btn full ${logged?'dark':''}" onclick="confirmMeal(${i})">${logged?'✓ Съедено · отменить':'Я это съел'}</button><button class="btn dark" onclick="editMeal(${i})" aria-label="Изменить ${x.title}">✎</button></div><button class="btn line small full" style="margin-top:8px" onclick="recipeV4(${i})">Рецепт по шагам →</button></div>`}).join('')}`}<button class="btn line full" onclick="addFood()">＋ Съел что-то другое</button>${day().food.filter(x=>x.menuSlot===undefined).map((f)=>`<p class="muted">${safe(f.name)} · ${f.kcal} ккал</p>`).join('')}<p class="tiny">Предпочтения и аллергии проверены по ограниченному каталогу. Упаковки и перекрёстные аллергены проверяй отдельно. Пищевая ценность примерная, не база брендов. Калории дополнительных соусов, напитков и добавок вноси отдельно.</p>`}
function recipeV4(i){const m=getMenu()[i];open(`${sheetHeader(m.title)}<h2>${m.name}</h2><div class="card">${m.items.map(x=>`<p>${foods[x.id][0]} · <strong>${x.g} г</strong></p>`).join('')}</div><ol class="instructions">${recipeSteps(m).map(x=>`<li>${x}</li>`).join('')}</ol><p class="tiny">Для вкуса: лимон, чеснок, паприка, укроп или прованские травы — по переносимости. Проверяй состав смесей. Дополнительные калорийные ингредиенты не входят в расчёт.</p><button class="btn full" onclick="batchCooking()">Приготовить сразу на несколько дней</button>`)}
function batchTotals(){const b=getBatch();if(b.error)return null;const out={};b.meals.flatMap(m=>m.items).forEach(x=>out[x.id]=(out[x.id]||0)+x.g*b.count);return out}
function batchCooking(){const b=getBatch();if(b.error){toast(b.error);return}const ts=batchTotals();open(`${sheetHeader('Одна готовка — '+b.count+' дня')}<h2>Четыре блюда, общая основа.</h2><ol class="instructions"><li>Подготовь и подпиши контейнеры датой. Молочные продукты и фрукты держи отдельно от горячих блюд.</li><li>Отвесь суммарные сырые / сухие продукты из списка ниже. Овощи раздели: часть запечь с паприкой, часть потушить с травами.</li><li>Готовь гарнир и источник белка параллельно, до безопасной готовности. Птица — 74 °C, рыба — 63 °C внутри.</li><li>Распредели готовые продукты пропорционально сырым граммовкам каждого блюда. После готовки взвесь общий выход: вес готовой порции = общий готовый вес × доля сырого продукта для порции.</li><li>Быстро охлади в неглубоких контейнерах, убери в холодильник ≤ 4 °C не позже 2 часов. Не держи всю кастрюлю на столе до полного остывания.</li><li>В этой версии оставь в холодильнике порции не более чем на 48 часов, остальные заморозь. Рис: быстро охладить, желательно в течение часа; в холодильнике — до 24 часов, более поздние порции сразу заморозить. Разогревай порцию до 74 °C; рис повторно не разогревай.</li></ol><details><summary>Все продукты на ${b.count} дня</summary>${Object.entries(ts).map(([id,g])=>`<p>${foods[id][0]} · ${g} г</p>`).join('')}</details><p class="tiny">Для лимона и специй предусмотрены отдельные позиции покупок; калории добавленного сока и соусов не включены. При сомнении в хранении не используй блюдо.</p><button class="btn full" onclick="state.currentBatch.cooked=!state.currentBatch.cooked;save();batchCooking()">${b.cooked?'✓ Заготовки готовы · отменить':'Заготовки готовы'}</button><button class="btn dark full" style="margin-top:10px" onclick="shopping()">Что купить →</button>`)}
function shopping(){const b=getBatch(),ts=batchTotals();if(!ts){open(`${sheetHeader('Список покупок')}<p>${safe(b.error)}</p><button class="btn full" onclick="startOnboarding()">Уточнить предпочтения</button>`);return}const labels={protein:'Мясо и рыба',fridge:'Холодильник',produce:'Овощи и фрукты',cereal:'Крупы и макароны',other:'Остальное'};open(`${sheetHeader('Купить на '+b.count+' дня')}<p class="muted">На одного человека · ${b.start} — ${dateAdd(b.start,b.count-1)}. Отметь то, что уже есть или куплено.</p>${Object.entries(labels).map(([cat,title])=>{const rows=Object.entries(ts).filter(([id])=>meta[id][2]===cat);return rows.length?`<h3 style="margin-top:20px">${title}</h3>${rows.map(([id,g])=>`<label class="check"><input type="checkbox" ${b.bought[id]?'checked':''} onchange="state.currentBatch.bought['${id}']=this.checked;save()"><span>${foods[id][0]}<br><small>${g>=1000?(g/1000).toFixed(2)+' кг':g+' г'} · сырое / сухое / съедобная часть</small></span></label>`).join('')}`:''}).join('')}<h3 style="margin-top:20px">Для вкуса · по переносимости</h3>${[['lemon','Лимон · 1 шт.'],['garlic','Чеснок · 1 головка'],['spices','Паприка / сушёные травы · 1 упаковка']].map(([id,t])=>`<label class="check"><input type="checkbox" ${b.bought[id]?'checked':''} onchange="state.currentBatch.bought['${id}']=this.checked;save()"><span>${t}</span></label>`).join('')}<p class="tiny">Вес — потребность рецептов, не число упаковок. Учитывай очистку и размер упаковки при покупке. Список относится к базовым заготовкам; изменения только сегодняшней порции не меняют уже запланированную закупку.</p><button class="btn full" onclick="exportShopping()">Сохранить список .txt</button>`)}
function downloadText(name,text,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportShopping(){const b=getBatch(),t=batchTotals();if(!t)return;downloadText('Покупки-'+date()+'.txt',`МОТИВАЦИЯ · ${b.count} дня · 1 человек\n${b.start} — ${dateAdd(b.start,b.count-1)}\n\n`+Object.entries(t).map(([id,g])=>`${b.bought[id]?'[x]':'[ ]'} ${foods[id][0]}: ${g} г`).join('\n')+'\n\nДля вкуса, по переносимости: лимон 1 шт., чеснок 1 головка, паприка / травы 1 упаковка.\nСырые / сухие / съедобные веса. Размер упаковки и потери при очистке учти при покупке.\n')}

const ingredient=(meal,tag)=>meal.items.find(x=>foods[x.id][4]===tag)?.id;const bp=ingredient(m[0],'p'),bc=ingredient(m[0],'c'),main=ingredient(m[1],'p');m[0].name=bp==='eggs'?'Яйца с гарниром, фрукты отдельно':bp==='tofu'?'Тёплый тофу с гарниром, фрукты отдельно':bc==='oats'?'Овсяная миска с ягодами или бананом':'Каша с творогом или йогуртом';m[2].name=bp==='eggs'?'Варёные яйца и фрукт':bp==='tofu'?'Тофу и фрукт · отдельно':'Нежная творожная или йогуртовая миска';m[1].name=(main==='fish'?'Рыба':main==='tofu'?'Тофу':main==='eggs'?'Яйца':'Птица')+(allowed('lemon')?' с лимонной заправкой':' с травами')+' и гарниром';m[3].name=allowed('tomato')?'Рагу в томатном соусе':'Овощное рагу с травами';m.forEach(x=>x.how=recipeSteps(x));return out};
recipeSteps=function(m){const ids=m.items.map(x=>x.id),has=id=>ids.includes(id),steps=[];if(has('oats'))steps.push('Отвесь хлопья сухими. Приготовь на воде по инструкции на упаковке.');else if(['rice','buckwheat','pasta'].some(has))steps.push('Отвесь крупу или макароны сухими, отвари по инструкции.');else if(has('potato'))steps.push('Отвесь очищенный сырой картофель, нарежь и запеки либо отвари до мягкости.');if(has('chicken')||has('turkey'))steps.push('Птицу нарежь. Используй только указанные в порции масло, лимон и чеснок, добавь переносимые травы. Приготовь до 74 °C внутри.');if(has('fish'))steps.push('Рыбу приправь переносимыми травами и указанными лимоном и маслом. Готовь до 63 °C внутри.');if(has('tofu'))steps.push('Тофу промокни, нарежь и прогрей с указанным маслом и переносимыми травами. Фрукты подавай отдельно, не туши вместе.');if(has('eggs'))steps.push('Яйца отвесь без скорлупы. Приготовь до полного схватывания белка и желтка. Для заготовок можно сварить вкрутую; фрукты подавай отдельно.');if(has('tomato'))steps.push('Протёртые томаты, указанный чеснок и овощи потуши с травами. Добавь приготовленный белковый продукт. Масло — только в отмеренном количестве.');else if(has('veg'))steps.push('Овощи запеки или потуши; используй отмеренное масло, травы по переносимости.');if(has('yogurt')||has('curd'))steps.push('Молочный продукт и фрукты добавляй при подаче. Горячую основу сначала остуди.');if(has('nuts'))steps.push('Добавь отмеренные орехи при подаче.');steps.push('Граммовки — для одной порции: крупы сухие, мясо и рыба сырые, овощи и фрукты — съедобная часть. Дополнительные соусы и сахар учитывай отдельно.');return steps};

if(!state.onboarded){$('welcome')?.remove();draw();startOnboarding()}else{draw()}

/* Small final integration: shopping excludes, accurate recipe names, optional weekly review. */
shopping=function(){const b=getBatch();if(b.error){toast(b.error);return}const t=batchTotals(),cats={protein:'Мясо и рыба',fridge:'Холодильник',cereal:'Крупы и макароны',produce:'Овощи и фрукты',other:'Масло и орехи'};open(`${sheetHeader('Купить на '+b.count+' дня')}<p class="muted">${b.start} — ${dateAdd(b.start,b.count-1)} · 1 человек</p>${Object.entries(cats).map(([key,title])=>{const items=Object.entries(t).filter(([id])=>meta[id][2]===key);if(!items.length)return '';return `<h3 style="margin-top:20px">${title}</h3>${items.map(([id,g])=>`<label class="check"><input type="checkbox" ${b.bought[id]?'checked':''} onchange="state.currentBatch.bought['${id}']=this.checked;save()"><span>${foods[id][0]}<br><small>${g>=1000?(g/1000).toFixed(2)+' кг':g+' г'}</small></span></label>`).join('')}`}).join('')}<p class="tiny">Сумма по базовым заготовкам, в сырых / сухих / съедобных весах. Количество упаковок и потери при очистке не учтены. Правка только сегодняшней порции не меняет весь блок закупки. Травы — по переносимости, отдельно: готовые смеси проверяй на аллергены.</p><button class="btn full" onclick="exportShopping()">Сохранить список .txt</button>`)};
exportShopping=function(){const b=getBatch(),t=batchTotals();if(!t)return;downloadText('Покупки-'+date()+'.txt',`МОТИВАЦИЯ · ${b.count} дня · 1 человек\n${b.start} — ${dateAdd(b.start,b.count-1)}\n\n`+Object.entries(t).map(([id,g])=>`${b.bought[id]?'[x]':'[ ]'} ${foods[id][0]}: ${g} г`).join('\n')+'\n\nСырые / сухие / съедобные веса. Размер упаковок и потери при очистке не учтены. Травы и готовые смеси — только по переносимости, проверь состав.\n')};
recipeV4=function(i){const m=getMenu()[i];open(`${sheetHeader(m.title)}<h2>${m.name}</h2><div class="card">${m.items.map(x=>`<p>${foods[x.id][0]} — <strong>${x.g} г</strong></p>`).join('')}</div><ol class="instructions">${recipeSteps(m).map(x=>`<li>${x}</li>`).join('')}</ol><p class="tiny">Соусы на основе указанных томатов, лимона и чеснока включены в расчёт. Травы и небольшое количество соли — по переносимости, не обязательны. Готовые смеси проверяй на аллергены. Это примерный рацион, не лечебное меню.</p><button class="btn full" onclick="batchCooking()">Приготовить на несколько дней</button>`)};
const weeklyHome=home;
home=function(){const html=weeklyHome();return state.onboarded?html+'<button class="btn line full small" style="margin-top:10px" onclick="weeklyReview()">Что получилось за неделю →</button>':html};
function weeklyReview(){const dates=Array.from({length:7},(_,i)=>dateAdd(date(),i-6)),ds=dates.map(d=>state.days[d]).filter(Boolean),work=ds.filter(d=>d.workout?.done).length,foodDays=ds.filter(d=>d.food.length).length,weights=dates.map(d=>state.days[d]?.weight).filter(w=>typeof w==='number'&&w>0),avg=weights.length?weights.reduce((a,b)=>a+b,0)/weights.length:null;open(`${sheetHeader('Неделя без оценок')}<div class="card"><p><strong>${work}</strong> тренировок записано</p><p><strong>${foodDays} из 7</strong> дней с записями еды</p><p>Средний вес: <strong>${avg?avg.toFixed(1)+' кг':'пока нет данных'}</strong>${avg?' · '+weights.length+' измер.':''}</p></div><p>Заполненный день еды не обязательно полный. Пустой день не считаем голодовкой. Вес сам по себе не показывает изменение жира.</p><p class="muted">Следующий шаг: выбери ближайший реальный день тренировки, подготовь еду и оцени восстановление. Не нужно «наказывать» себя за пропуски.</p><p class="tiny">Калории и нагрузка не меняются по одному взвешиванию. Для пересмотра нужны хотя бы 2 недели тенденций, талия, полнота дневника и самочувствие. Автоматического изменения норм здесь нет.</p><button class="btn full" onclick="weekPlan()">Посмотреть ближайшие дни</button>`)}
// Do not reuse an outdated menu when profile preferences are edited; logged food stays factual.
const finalBoot=()=>{if(!state.onboarded){$('welcome')?.remove();draw();startOnboarding()}else draw()};
finalBoot();


/* v6: formula confirmation, open product lookup, one visual language for every exercise. */
function showTargetConfirm(r){open(`${sheetHeader('Проверь расчёт')}<p class="muted">Это стартовая оценка по анкете. Подтверди её или скорректируй перед созданием плана.</p><div class="card"><p>Формула дала: <strong>${r.kcal} ккал</strong> · Б ${r.p} г · Ж ${r.f} г · У ${r.c} г</p><small>Дальше ориентиры пересматриваются по тенденции веса, талии, дневнику и восстановлению — не по одному взвешиванию.</small></div><div class="grid"><label class="field"><span>Калории</span><input id="confirmKcal" type="number" min="1000" max="7000" step="50" value="${r.kcal}" required></label><label class="field"><span>Белок, г</span><input id="confirmP" type="number" min="50" max="500" step="1" value="${r.p}" required></label><label class="field"><span>Жиры, г</span><input id="confirmF" type="number" min="25" max="300" step="1" value="${r.f}" required></label><label class="field"><span>Углеводы, г</span><input id="confirmC" type="number" min="50" max="900" step="1" value="${r.c}" required></label></div><p class="tiny">Изменение вручную помечается как подтверждённый тобой ориентир. Это не медицинское назначение.</p><button class="btn full" onclick="confirmTargets()">Принять и создать план →</button><button class="btn line full small" style="margin-top:10px" onclick="onStep=3;onboard()">← Вернуться к предпочтениям</button>`)}
function confirmTargets(){for(const id of ['confirmKcal','confirmP','confirmF','confirmC']){const el=$(id);if(!el.checkValidity()){el.reportValidity();return}}state.manualTargets={kcal:Number($('confirmKcal').value),p:Number($('confirmP').value),f:Number($('confirmF').value),c:Number($('confirmC').value)};state._confirmingTargets=true;advanceOnboarding()}
function productLookup(){open(`${sheetHeader('Найти продукт')}<p class="muted">Поиск по открытой базе Open Food Facts. Значения нужно проверить по упаковке.</p><form id="lookupForm"><label class="field"><span>Название или штрихкод</span><input id="lookupQ" required maxlength="100" placeholder="Например, творог или 460..."></label><button class="btn full">Найти</button></form><div id="lookupResults"></div><p class="tiny">Open Food Facts — сторонний каталог. База может содержать ошибки и неполные карточки. Аллергены и этикетку проверяй сам.</p>`);$('lookupForm').onsubmit=async e=>{e.preventDefault();const q=$('lookupQ').value.trim(),box=$('lookupResults');box.innerHTML='<p class="muted">Ищу…</p>';try{const url=/^\d{8,14}$/.test(q)?`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(q)}.json`:`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8`;const res=await fetch(url,{headers:{Accept:'application/json'}});if(!res.ok)throw Error('HTTP');const data=await res.json();const products=data.products||((data.product&&data.product.product_name)?[data.product]:[]);if(!products.length){box.innerHTML='<p class="muted">Ничего не найдено. Проверь запрос или введи блюдо вручную.</p>';return}box.innerHTML=products.slice(0,8).map((x,i)=>{const n=x.product_name||x.product_name_ru||'Без названия',nut=x.nutriments||{},k=Math.round(Number(nut['energy-kcal_100g']||nut['energy-kcal_value']||0)),p=Number(nut.proteins_100g||0),f=Number(nut.fat_100g||0),c=Number(nut.carbohydrates_100g||0);return `<div class="lineitem"><strong>${safe(n)}</strong><br><small>на 100 г: ${k||'—'} ккал · Б ${p||'—'} · Ж ${f||'—'} · У ${c||'—'}</small><button class="btn dark small" style="margin-top:8px" onclick="useProduct(${JSON.stringify({name:n,kcal:k,p,f,c}).replace(/</g,'\\u003c')})">Добавить 100 г</button></div>`}).join('')}catch(err){box.innerHTML='<p class="muted">Поиск недоступен. Можно добавить еду вручную.</p>';}}}
function useProduct(x){day().food.push({...x,source:'Open Food Facts',grams:100});if(save()){$('dialog').close();draw();toast('Продукт добавлен как 100 г. Откорректируй порцию при необходимости.')}}
const oldAddFoodV6=addFood;
addFood=function(){oldAddFoodV6();$('dialog').insertAdjacentHTML('afterbegin',`<button class="btn dark full small" style="margin-bottom:10px" onclick="productLookup()">Найти продукт в открытой базе →</button>`)};
function uniformExerciseVisual(name){const lower=name.toLowerCase();let mode=lower.includes('ног')?'legs':lower.includes('жим')?'push':lower.includes('тяга')?'pull':lower.includes('сгиб')?'curl':lower.includes('разгиб')?'pushdown':lower.includes('бицеп')?'curl':lower.includes('плеч')||lower.includes('сторон')?'raise':lower.includes('мост')?'bridge':'core';const motions={legs:['M40 188 H260','M120 140 L85 190 M180 140 L215 190'],push:['M80 160 H220','M110 145 L75 105 M190 145 L225 105'],pull:['M80 95 H220','M110 105 L150 155 M190 105 L150 155'],curl:['M105 105 L125 165 M195 105 L175 165','M105 105 L150 65 M195 105 L150 65'],pushdown:['M105 90 L125 145 M195 90 L175 145','M105 90 L105 175 M195 90 L195 175'],raise:['M150 95 L75 80 M150 95 L225 80','M150 95 L110 35 M150 95 L190 35'],bridge:['M70 175 L145 150 L225 175','M70 175 L150 120 L225 175'],core:['M80 165 L150 145 L220 165','M80 165 L150 115 L220 165']}[mode];return `<div class="uniform-motion"><div class="guide-label">ДВИЖЕНИЕ · ${safe(name)}</div><svg viewBox="0 0 300 220" role="img" aria-label="Единая схема движения ${safe(name)}"><path d="M35 195 H265" stroke="#444943" stroke-width="4" stroke-linecap="round"/><g class="motion-body"><circle cx="150" cy="45" r="15" fill="#f2f3ee"/><path d="M150 61 L150 125" stroke="#f2f3ee" stroke-width="10" stroke-linecap="round"/><path d="${motions[0]}" fill="none" stroke="#d6ff62" stroke-width="10" stroke-linecap="round"/><path d="${motions[1]}" fill="none" stroke="#f2f3ee" stroke-width="10" stroke-linecap="round"/></g><path d="M240 45 l18 10 -18 10" fill="none" stroke="#d6ff62" stroke-width="4"/><text x="25" y="215" fill="#a5ada0" font-size="10">СТАРТ</text><text x="230" y="215" fill="#a5ada0" font-size="10">ПОВТОР</text></svg><span class="chip">Единый стиль · старт → усилие → возврат</span></div>`}
guideCards=function(name){const g=EXGUIDE[name];return `${uniformExerciseVisual(name)}<div class="guide-steps"><details open><summary>① Настройка и исходное положение</summary><p>${g?g.setup:'Настрой тренажёр по росту, зафиксируй корпус и выбери лёгкий вес для первого подхода. Попроси тренера проверить положение.'}</p></details><details open><summary>② Как двигаться</summary><p>${g?g.move:'Двигайся плавно: усилие без рывка, затем контролируемый возврат. Сохраняй одинаковую амплитуду.'}</p></details><details open><summary>③ Ошибки и дыхание</summary><p>${g?g.avoid:'Не раскачивай корпус, не бросай вес и не продолжай через боль. Обычно выдох на усилие, вдох на возврат.'}</p></details></div><p class="tiny">Эта единая схема показывает направление движения, а не проверяет твою технику. Для нового тренажёра попроси тренера о первом показе.</p>`}
const v6style=document.createElement('style');v6style.textContent='.uniform-motion{background:radial-gradient(ellipse at 50% 70%,#30372a,#171a18);border:1px solid #414a35;border-radius:20px;text-align:center;margin:15px 0;padding:8px}.uniform-motion svg{display:block;width:100%;height:200px}.uniform-motion .motion-body{transform-origin:150px 120px;animation:motivationMove 2.8s ease-in-out infinite alternate}.uniform-motion:after{content:"";display:block;height:3px;width:35%;margin:8px auto 0;background:var(--accent);border-radius:4px;animation:motivationPulse 2.8s ease-in-out infinite alternate}@keyframes motivationMove{from{transform:translate(0,0)}to{transform:translate(0,-6px) scale(.98,1.02)}}@keyframes motivationPulse{from{width:25%;opacity:.45}to{width:65%;opacity:1}}@media(prefers-reduced-motion:reduce){.uniform-motion .motion-body,.uniform-motion:after{animation:none}}';document.head.append(v6style);
// Food database must be opt-in: the local prototype remains usable without network access.
const v6Boot=()=>{if(!state.onboarded){$('welcome')?.remove();draw();startOnboarding()}else draw()};v6Boot();

</script></body></html>
